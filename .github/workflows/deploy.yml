name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Served from https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          # They end up in the public JS bundle either way, so variables rather than secrets.
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          VITE_LASTFM_API_KEY: ${{ vars.VITE_LASTFM_API_KEY }}
          VITE_REDIRECT_URI: ${{ vars.VITE_REDIRECT_URI }}
      # GitHub Pages has no SPA rewrites; serving the app as the 404 page makes /callback work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
