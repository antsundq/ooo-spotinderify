# Alternative to GitHub Pages. Set VITE_SPOTIFY_CLIENT_ID, VITE_LASTFM_API_KEY and
# VITE_REDIRECT_URI (https://<site>.netlify.app/callback) under Site configuration → Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: serve index.html for /callback and any other path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
